<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang the Mittens! · Caterpillar Class</title>
<style>
:root{--navy:#1F3A5F;--blue:#4A90C2;--red:#D9483B;--yellow:#F2B84B;--green:#6BAA3B;--paper:#F4C53D;--ink:#1F2A37}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Calibri,sans-serif;background:#FFF8E6;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{font-family:Cambria,Georgia,serif;font-size:clamp(20px,2.6vw,32px)}
header .sub{font-size:clamp(11px,1.1vw,14px);opacity:.85}
.steps{display:flex;gap:8px}
.steps span{font-size:clamp(20px,2.4vw,30px);opacity:.3;filter:grayscale(1);transition:.3s}
.steps span.on{opacity:1;filter:none;transform:scale(1.15)}
.steps span.done{opacity:.8;filter:none}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,48px);padding:10px 16px;min-height:0}
@media(max-width:899px){main{flex-direction:column;gap:6px}}
/* board = yellow paper with dots, like our art */
.board{position:relative;width:min(62vw,calc(66vh*1.45),900px);aspect-ratio:1.45/1;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(31,58,95,.18);
  background-color:var(--paper);
  background-image:radial-gradient(circle,#fff 0 9px,transparent 10px),radial-gradient(circle,#D9483B 0 7px,transparent 8px),radial-gradient(circle,#4A90C2 0 5px,transparent 6px),radial-gradient(circle,#FFE680 0 8px,transparent 9px);
  background-size:150px 130px,190px 170px,120px 150px,170px 120px;background-position:20px 30px,90px 10px,50px 80px,130px 70px}
@media(max-width:899px){.board{width:94vw}}
.board svg.rope{position:absolute;inset:0;width:100%;height:100%}
.mit{position:absolute;width:21%;transform-origin:50% 0;transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1),transform .9s,opacity .3s;cursor:pointer}
.mit svg{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 4px rgba(0,0,0,.18))}
.mit.waiting{opacity:0;pointer-events:none}
.mit.hung{animation:swing 1.6s ease-in-out}
.mit.tapme{animation:bounce 1s ease-in-out infinite}
.mit.wiggle{animation:wig .6s}
.windy .mit{animation:wind 1.1s ease-in-out 3}
@keyframes swing{0%{transform:rotate(14deg)}30%{transform:rotate(-9deg)}60%{transform:rotate(5deg)}100%{transform:rotate(0)}}
@keyframes bounce{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg) translateY(-3%)}}
@keyframes wig{0%,100%{transform:scale(1)}30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(1.12) rotate(6deg)}}
@keyframes wind{0%,100%{transform:rotate(0)}40%{transform:rotate(-28deg) skewX(4deg)}70%{transform:rotate(10deg)}}
.clip{position:absolute;width:3.4%;height:13%;background:linear-gradient(90deg,#D7B48A,#F0D7B0,#C99C68);border-radius:3px;transform:translate(-50%,-30%) scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1) .75s;box-shadow:0 2px 2px rgba(0,0,0,.2)}
.clip::after{content:"";position:absolute;left:10%;right:10%;top:38%;height:10%;background:#8A6236;border-radius:2px}
.clip.on{transform:translate(-50%,-30%) scale(1)}
.windy .clip{animation:none}
.gust{position:absolute;left:-20%;top:20%;font-size:clamp(50px,8vw,100px);opacity:0}
.windy .gust{animation:gust 3.3s ease-in-out}
@keyframes gust{0%{left:-20%;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:105%;opacity:0}}
.photo{position:absolute;inset:0;background:rgba(31,58,95,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .6s}
.photo.on{opacity:1;pointer-events:auto}
.photo img{max-width:78%;max-height:72%;border-radius:12px;border:6px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:scale(.7) rotate(-4deg);transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.photo.on img{transform:scale(1) rotate(-2deg)}
.photo b{color:#fff;font-family:Cambria,Georgia,serif;font-size:clamp(26px,4vh,44px)}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:min(300px,90vw)}
.word{font-family:Cambria,Georgia,serif;font-size:clamp(34px,6vh,64px);font-weight:700;color:var(--red);min-height:1.2em;text-align:center;cursor:pointer;line-height:1.1}
.word.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.big-btn{border:none;background:#fff;border-radius:50%;width:clamp(140px,22vh,210px);height:clamp(140px,22vh,210px);font-size:clamp(76px,12vh,120px);line-height:1;cursor:pointer;box-shadow:0 10px 24px rgba(31,58,95,.18),inset 0 -8px 0 rgba(0,0,0,.05);display:grid;place-items:center;animation:pulse 1.4s infinite}
.big-btn:active{transform:scale(.93)}
.big-btn.hide{display:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tap{font-size:clamp(16px,2.2vh,22px);color:var(--navy);font-weight:700;text-align:center}
.again{border:none;border-radius:999px;background:var(--green);color:#fff;font-size:clamp(20px,3vh,28px);font-weight:700;padding:14px 34px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);display:none}
.parent{background:#FFF0C8;border-top:3px solid var(--yellow);padding:8px 16px;font-size:clamp(13px,1.7vh,17px);color:#5c4a22;text-align:center;line-height:1.45}
.parent b{color:var(--red)}
.say{display:inline-block;background:#fff;border-radius:999px;padding:1px 10px;margin:2px 3px;font-weight:700;color:var(--navy);cursor:pointer;border:1px solid #F2D58A}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;font-size:28px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
</style></head>

let audioCtx,unlocked=false;
function unlockAudio(){if(unlocked)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const b=audioCtx.createBuffer(1,1,22050);const s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);s.start(0);audioCtx.resume();unlocked=true;}catch(e){}}
document.addEventListener('touchstart',unlockAudio,{once:true});document.addEventListener('click',unlockAudio,{once:true});
function speak(t){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function sfx(kind){try{if(!audioCtx)return;audioCtx.resume();const t=audioCtx.currentTime;
  if(kind==='clip'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(300,t+.06);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.1);return;}
  const notes=kind==='down'?[784,659,523]:[523,659,784];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.16,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.35);o.connect(g).connect(audioCtx.destination);o.start(t+i*.09);o.stop(t+i*.09+.4);});}catch(e){}}

  fill:`<path d="${SHAPE}" fill="#fff"/>
   <g clip-path="url(#cCl)"><path d="M28 50 L60 70 L88 52 L88 4 L28 4 Z" fill="#9CC4E8"/><path d="M50 80 L88 90 L88 40 L62 36 Z" fill="#6FA3D6"/><path d="M28 30 L52 42 L60 4 L28 4Z" fill="#F7F3EA"/>
   <g fill="#F2B84B"><circle cx="44" cy="60" r="3"/><circle cx="70" cy="66" r="2.5"/><circle cx="58" cy="22" r="3"/><circle cx="78" cy="30" r="2.5"/><path d="M36 40 l6 2 l-2 -6z"/><circle cx="62" cy="110" r="2.5"/></g></g>
   <defs><clipPath id="cCl"><path d="${SHAPE}"/></clipPath></defs>`},
 {id:'sticker',word:'Butterfly!',say:'Butterfly! I like this one!',
  fill:`<path d="${SHAPE}" fill="#fff"/>
   <text x="12" y="104" font-size="13">🦋</text><text x="62" y="126" font-size="15">🦋</text><text x="40" y="72" font-size="15">🌸</text><text x="64" y="40" font-size="15">🦋</text><text x="36" y="26" font-size="14">🌼</text>`}
];
const SLOTS=[[22,26],[51,31],[80,25]]; // % of board: x center, rope y
const PARENT=[
  '🧺 바구니를 누르면 장갑이 빨랫줄에 걸려요. 함께 말해요: <span class="say">Hang it up!</span><span class="say">Clip!</span><span class="say">One, two, three!</span>',
  '👆 아이가 좋아하는 장갑을 직접 눌러 보게 해 주세요. <span class="say">Which one?</span> → <span class="say">This one!</span> 손가락으로 가리키기만 해도 충분해요.',
  '💨 바람 버튼을 누르면 장갑이 흔들려요. 아이와 함께 팔을 흔들며 <span class="say">Whoosh!</span> 해 보세요.',
  '🎉 우리 반 진짜 작품이에요! <span class="say">Look! Our mittens!</span> 박수 치고 <b>Again!</b>으로 한 번 더 해도 좋아요.'
];
const $=id=>document.getElementById(id);
let phase=0,count=0,liked=0,busy=false;

function mittenSVG(m){return `<svg viewBox="0 0 100 140">${m.fill}<path d="${SHAPE}" fill="none" stroke="#1F2A37" stroke-width="5" stroke-linejoin="round"/></svg>`;}
function build(){
  const box=$('mits');box.innerHTML='';
  MITTENS.forEach((m,i)=>{
    const d=document.createElement('div');d.className='mit waiting';d.id='m'+i;d.innerHTML=mittenSVG(m);
    d.style.left='39.5%';d.style.top='105%';d.style.transform='rotate(-20deg)';
    d.onclick=()=>pick(i);box.appendChild(d);
    const c=document.createElement('div');c.className='clip';c.id='c'+i;c.style.left=SLOTS[i][0]+'%';c.style.top=SLOTS[i][1]+'%';box.appendChild(c);
  });
}
function setPhase(p){
  phase=p;
  ['st0','st1','st2'].forEach((id,i)=>{$(id).className=i<p?'done':(i===p?'on':'');});
  $('parent').innerHTML=PARENT[Math.min(p,3)];
  document.querySelectorAll('#parent .say').forEach(s=>s.onclick=()=>speak(s.textContent));
  const b=$('btn');
  b.classList.toggle('hide',p===1||p>=3);
  if(p===0){b.textContent='🧺';$('tap').textContent='Tap! 바구니를 눌러요';}
  if(p===1){$('tap').textContent='Tap a mitten! 장갑을 눌러요';document.querySelectorAll('.mit').forEach(m=>m.classList.add('tapme'));}
  if(p===2){b.textContent='💨';$('tap').textContent='Tap! 바람을 불어요';}
  if(p>=3){$('tap').textContent='';}
  $('again').style.display=p>=3?'inline-block':'none';
}
function showWord(w){const e=$('word');e.textContent=w;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');e.onclick=()=>speak(w);}
function burst(x,y){const s=$('stars');for(let i=0;i<10;i++){const e=document.createElement('div');e.className='star';e.textContent=['✨','⭐','🧤'][i%3];e.style.left=x+'%';e.style.top=y+'%';e.style.setProperty('--dx',(Math.random()*240-120)+'px');e.style.setProperty('--dy',(Math.random()*240-120)+'px');s.appendChild(e);setTimeout(()=>e.remove(),1100);}}
const NUM=['One mitten!','Two mittens!','Three mittens!'];
function hang(){
  const i=count, m=$('m'+i), [x,y]=SLOTS[i];
  m.classList.remove('waiting');
  requestAnimationFrame(()=>{m.style.left=(x-10.5)+'%';m.style.top=(y-1)+'%';m.style.transform='rotate(0deg)';});
  $('c'+i).classList.add('on');
  showWord('Hang it up!');speak('Hang it up!');
  setTimeout(()=>{sfx('clip');m.classList.add('hung');showWord('Clip!');speak('Clip!');},900);
  setTimeout(()=>{showWord(NUM[i]);speak(NUM[i]);burst(x,y+20);sfx('up');},1800);
  count++;
  if(count>=3)setTimeout(()=>setPhase(1),3000);
}
function pick(i){
  if(phase!==1||busy)return;busy=true;setTimeout(()=>busy=false,700);
  const m=$('m'+i);m.classList.remove('tapme','wiggle','hung');void m.offsetWidth;m.classList.add('wiggle');
  showWord(MITTENS[i].word);speak(MITTENS[i].say);sfx('up');burst(SLOTS[i][0],SLOTS[i][1]+20);
  liked++;
  if(liked>=2&&phase===1)setTimeout(()=>{document.querySelectorAll('.mit').forEach(x=>x.classList.remove('tapme'));setPhase(2);},2200);
}
function wind(){
  const b=$('board');b.classList.remove('windy');void b.offsetWidth;b.classList.add('windy');
  document.querySelectorAll('.mit').forEach(x=>x.classList.remove('hung','wiggle','tapme'));
  showWord('Whoosh!');speak('Whoosh! The wind!');$('btn').classList.add('hide');
  setTimeout(()=>{b.classList.remove('windy');$('photo').classList.add('on');showWord('Yay!');speak('Look! Our mittens!');sfx('up');setPhase(3);},3500);
}
function tap(){
  if(busy)return;busy=true;setTimeout(()=>busy=false,phase===0?2000:900);
  if(phase===0)hang();else if(phase===2)wind();
}
function reset(){
  speechSynthesis.cancel();count=0;liked=0;busy=false;
  $('photo').classList.remove('on');$('board').classList.remove('windy');$('word').textContent='';
  build();setPhase(0);
}
$('btn').onclick=tap;$('again').onclick=reset;
$('photo').onclick=()=>speak('Look! Our mittens!');
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(phase>=3)reset();else if(phase===1){pick([0,1,2][liked%3]);}else tap();}
  else if(e.key==='r'||e.key==='R')reset();
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
});
reset();
</script>
</body></html>
